name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # `claude plugin validate` rules change between releases: bump after `just validate` passes locally
  CLAUDE_CLI_VERSION: 2.1.314

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install Claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        # Runs all hooks (equivalent to `just all`):
        #   fmt      → shfmt, justfmt
        #   lint     → shellcheck, json-validate, script-permissions
        #   validate → validate-plugins (includes claude plugin validate)
